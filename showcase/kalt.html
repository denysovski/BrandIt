<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KALT: a BrandIt showcase in 10 frames</title>
<meta name="description" content="A 10-frame Instagram case study for KALT, a fictional cold-process skincare line. Film grain, ice, frost and brushed steel, all drawn in SVG with BrandIt.">
<link rel="stylesheet" href="frames.css">
<style>
:root { --grain: #8e9094; --fog: #c9ccd0; --ice: #e8eef2; --frost: #f6f8f9; --metal: #5e646b; --ink: #16181b; --paper: #f7f7f5; }
.fr { background: var(--grain); color: var(--ink); }
.fr.dark { background: var(--ink); color: var(--ice); }
.fr.paper { background: var(--paper); }
.kw { font-stretch: 62%; font-weight: 500; letter-spacing: .14em; }
.call { position: absolute; height: 1px; background: var(--ink); transform-origin: 0 50%; }
.call::before { content: ""; position: absolute; left: -4px; top: -4px; width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--ink); background: var(--frost); }
.thumb { position: absolute; overflow: hidden; }
.thumb > .art { position: absolute; left: 0; top: 0; }
.f05 .card { position: absolute; left: 90px; right: 90px; top: 150px; bottom: 150px; background: #0e1012; }
.f08 .row { position: absolute; left: 60px; right: 480px; display: grid; grid-template-columns: 70px 1fr; gap: 18px; padding-top: 18px; border-top: 1px solid rgba(22,24,27,.3); }
.sw { position: absolute; left: 60px; right: 60px; bottom: 60px; height: 300px; display: grid; grid-template-columns: repeat(6, 1fr); }
.sw div { position: relative; }
.sw .m { left: 14px; bottom: 14px; }
</style>
</head>
<body>
<header class="top"><span>KALT · a BrandIt showcase · 10 frames, 1080 × 1350</span><a href="../README.md#showcase">How to use it</a></header>
<main class="wall" id="wall"></main>
<script type="module">
import { grain, ice, frost, bottle, jar, drops } from './draw.js';
const F = [];
const corners = (a, b, c, d) => [[a, 'left:60px;top:56px'], [b, 'right:60px;top:56px;text-align:right'], [c, 'left:60px;bottom:52px', 'dim'], [d, 'right:60px;bottom:52px;text-align:right', 'dim']]
  .filter(([t]) => t).map(([t, s, k = '']) => `<p class="m s ${k}" style="${s}">${t}</p>`).join('');
const at = (x, y, html) => `<div class="ab" style="left:${x}px;top:${y}px">${html}</div>`;
const thumb = (x, y, w, h, html) => `<div class="thumb" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${html}</div>`;
// callout: a line from (x,y) with a length and an angle, and a label at its end
const call = (x, y, len, deg, label, lx, ly, align = 'left') => `<span class="call" style="left:${x}px;top:${y}px;width:${len}px;rotate:${deg}deg"></span><p class="m s" style="left:${lx}px;top:${ly}px;text-align:${align}">${label}</p>`;

// 01 cover: a small picture in the middle of a grain field, labelled on both sides
F.push(['Cover', 'f01', `${grain({ seed: 2 })}
  ${thumb(390, 470, 300, 380, ice({ w: 300, h: 380, seed: 12, scale: 1.8 }) + at(95, 96, bottle({ size: 210, shadow: false })))}
  <p class="m s" style="left:150px;top:640px;text-align:right;width:210px">Cold process<br>skincare</p>
  <p class="m s" style="left:720px;top:640px;width:210px">Made at<br>4 °C</p>
  ${corners('KALT©', 'Case study<br>2026', 'Identity, packaging,<br>art direction', 'Fictional brand')}
  <p class="word kw" style="left:0;right:0;bottom:150px;text-align:center;font-size:58px">KALT</p>`]);
// 02 ice macro
F.push(['Ice', 'f02 dark', `${ice({ w: 1080, h: 1350, seed: 5, dark: true, scale: 2.4 })}<div class="ab scrim" style="left:0;right:0;bottom:0;height:620px;background:linear-gradient(180deg,rgba(22,24,27,0),rgba(22,24,27,.88))"></div>
  ${corners('KALT©', '02', '', 'Texture study')}
  <p class="m" style="left:60px;bottom:120px;max-width:470px;color:#f6f8f9">Formulated cold.<br>Nothing is heated,<br>so the actives<br>arrive whole.</p>`]);
// 03 product on frost with callouts
F.push(['Product', 'f03', `${grain({ seed: 4, tone: '#a3a7ab' })}${at(0, 820, frost({ w: 1080, h: 530 }))}
  ${at(300, 330, bottle({ size: 620 }))}${at(560, 770, jar({ size: 380 }))}
  ${call(420, 380, 210, 0, 'Airless pump', 650, 370)}
  ${call(440, 640, 250, -12, 'Brushed steel<br>0.4 mm wall', 700, 560)}
  ${call(330, 900, 200, 160, 'Serum · 30 ml', 60, 950)}
  ${call(760, 820, 160, -40, 'Hex jar, refill<br>cream · 50 ml', 860, 680)}
  ${corners('KALT©', 'Product', 'Serum and cream', 'Steel, glass insert')}`]);
// 04 water drops
F.push(['Water', 'f04', `${drops({ w: 1080, h: 1350, seed: 14, count: 160 })}
  ${corners('KALT©', 'Water first', '', '04')}
  <p class="word kw" style="left:60px;bottom:110px;font-size:120px;color:#f6f8f9">WATER<br>FIRST</p>`]);
// 05 dark card with wordmark and four text blocks
F.push(['Wordmark', 'f05', `${grain({ seed: 6, tone: '#7d8085' })}<div class="card"></div>
  <p class="word kw" style="left:0;right:0;top:560px;text-align:center;font-size:150px;color:var(--ice)">KALT©</p>
  <p class="m s" style="left:140px;top:210px;max-width:300px;color:var(--fog)">Cold process.<br>Mixed under 4 °C,<br>never heated.</p>
  <p class="m s" style="right:140px;top:210px;max-width:300px;text-align:right;color:var(--fog)">Three steps.<br>Mist, serum, cream.<br>Nothing else.</p>
  <p class="m s" style="left:140px;bottom:210px;max-width:300px;color:var(--fog)">Steel and glass.<br>Refills in paper.</p>
  <p class="m s" style="right:140px;bottom:210px;max-width:300px;text-align:right;color:var(--fog)">For skin that<br>runs warm.</p>`]);
// 06 scattered grid of small pictures on paper
const tiles = [
  [90, 160, 170, 220, ice({ w: 170, h: 220, seed: 31, scale: 0.4 })], [330, 120, 140, 140, drops({ w: 140, h: 140, seed: 3, count: 14 })], [560, 200, 200, 250, grain({ w: 200, h: 250, seed: 7 }) + at(58, 30, bottle({ size: 200, shadow: false }))],
  [830, 120, 160, 200, ice({ w: 160, h: 200, seed: 8, dark: true, scale: 0.5 })], [150, 470, 240, 180, frost({ w: 240, h: 180, seed: 9 })], [470, 560, 150, 190, drops({ w: 150, h: 190, seed: 5, count: 18 })],
  [700, 520, 280, 200, grain({ w: 280, h: 200, seed: 12, tone: '#c9ccd0' }) + at(40, 40, jar({ size: 200, shadow: false }))], [80, 760, 190, 250, ice({ w: 190, h: 250, seed: 17, scale: 0.7 })],
  [360, 850, 210, 160, grain({ w: 210, h: 160, seed: 13, tone: '#16181b' })], [650, 820, 150, 210, frost({ w: 150, h: 210, seed: 19 })], [860, 800, 140, 180, drops({ w: 140, h: 180, seed: 23, count: 16 })],
  [230, 1080, 160, 150, ice({ w: 160, h: 150, seed: 41, dark: true, scale: 0.4 })], [560, 1100, 230, 150, ice({ w: 230, h: 150, seed: 44, scale: 0.9 })],
];
F.push(['References', 'f06 paper', `${tiles.map(([x, y, w, h, a]) => thumb(x, y, w, h, a)).join('')}
  <p class="word kw" style="left:388px;top:900px;font-size:44px;color:var(--frost)">KALT</p>
  ${corners('KALT©', 'References', 'Ice, steel, water, grain', '06')}`]);
// 07 jar on dark ice
F.push(['Refill', 'f07 dark', `${ice({ w: 1080, h: 1350, seed: 22, dark: true, scale: 2 })}<div class="ab scrim" style="left:0;right:0;top:0;height:560px;background:linear-gradient(0deg,rgba(22,24,27,0),rgba(22,24,27,.85))"></div>${at(250, 500, jar({ size: 580 }))}
  ${corners('KALT©', 'Refill', 'The jar stays.<br>The cream comes in paper.', '07')}
  <p class="word kw" style="left:60px;top:150px;font-size:96px;color:var(--frost)">KEEP<br>THE JAR</p>`]);
// 08 formula sheet
const rows = [['01', 'Glacial water', 'Base of every step. Filtered, not boiled.'], ['02', 'Niacinamide 4 %', 'Calms redness and evens tone.'], ['03', 'Cold-pressed oat oil', 'Pressed under 30 °C to keep the lipids.'], ['04', 'Menthyl lactate', 'A cool touch that fades in a minute.']];
F.push(['Formula', 'f08', `${grain({ seed: 9, tone: '#b3b7bb' })}${at(660, 300, bottle({ size: 700 }))}
  <p class="word kw" style="left:60px;top:150px;font-size:110px">FOUR<br>THINGS</p>
  ${rows.map(([nr, a, b], i) => `<div class="row" style="top:${480 + i * 170}px"><p class="m s" style="position:static">${nr}</p><div><p class="m" style="position:static">${a}</p><p style="margin-top:8px;font-size:22px;line-height:1.3;max-width:420px">${b}</p></div></div>`).join('')}
  ${corners('KALT©', 'Formula', '', '08')}`]);
// 09 type and colour
const pal = [['#8e9094', 'Grain', '#16181b'], ['#c9ccd0', 'Fog', '#16181b'], ['#e8eef2', 'Ice', '#16181b'], ['#f6f8f9', 'Frost', '#16181b'], ['#5e646b', 'Metal', '#fff'], ['#16181b', 'Ink', '#fff']];
F.push(['Type and colour', 'f09 paper', `${corners('KALT©', 'Type and colour', '', '09')}
  <p class="m s dim" style="left:60px;top:200px">Display: Archivo 62 % width, 500, tracked</p>
  <p class="word kw" style="left:60px;top:240px;font-size:200px">KALT</p>
  <p class="m s dim" style="left:60px;top:500px">Text: Host Grotesk 400</p>
  <p style="position:absolute;left:60px;top:540px;max-width:820px;font-size:46px;line-height:1.1;letter-spacing:-.015em">Formulated cold. Nothing is heated, so the actives arrive whole.</p>
  <p class="m s dim" style="left:60px;top:740px">Labels: IBM Plex Mono 500</p>
  <p class="m" style="left:60px;top:775px">Serum · 30 ml · Made at 4 °C</p>
  <div class="sw">${pal.map(([c, n, t]) => `<div style="background:${c};color:${t}"><p class="m s">${n}<br>${c}</p></div>`).join('')}</div>`]);
// 10 credits
F.push(['Credits', 'f10 dark', `${grain({ seed: 11, tone: '#16181b', amount: 0.3 })}
  ${thumb(390, 200, 300, 380, ice({ w: 300, h: 380, seed: 12, scale: 1.8 }) + at(95, 96, bottle({ size: 210, shadow: false })))}
  <p class="word kw" style="left:0;right:0;top:660px;text-align:center;font-size:80px;color:var(--ice)">KALT©</p>
  <p class="m s" style="left:200px;top:820px;width:300px;text-align:right;color:var(--fog);line-height:2">Project<br>Year<br>Scope<br>Made with</p>
  <p class="m s" style="left:540px;top:820px;width:400px;color:var(--ice);line-height:2">KALT© cold skincare<br>2026<br>Identity, packaging, feed<br>BrandIt</p>
  <p class="m s dim" style="left:0;right:0;bottom:120px;text-align:center;color:var(--fog)">Fictional brand · concept study</p>`]);

const exportMode = new URLSearchParams(location.search).has('export');
if (exportMode) document.documentElement.classList.add('export');
document.getElementById('wall').innerHTML = F.map(([name, cls, html], i) => `<figure><div class="slot"><section class="fr ${cls}" id="frame-${String(i + 1).padStart(2, '0')}" aria-label="${name}">${html}</section></div><figcaption class="cap">${String(i + 1).padStart(2, '0')} / ${name}</figcaption></figure>`).join('');
document.fonts.ready.then(() => document.documentElement.dataset.ready = '1');
</script>
</body>
</html>
